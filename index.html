<script>
const lessons=[
{id:'fundamentos',icon:'🧭',title:'Del problema al modelo',short:'Qué es una BD y cómo se diseña antes de dibujar.',intro:'El objetivo es traducir necesidades reales a una estructura clara, comprobable y útil.',body:`<h2>Qué problema resuelve una base de datos</h2><p>Una base de datos (BD) es un conjunto organizado de datos relacionados. Un sistema gestor de bases de datos (SGBD) permite definirlos, consultarlos, protegerlos y mantener su integridad. Separar los datos de los programas ayuda a reducir duplicaciones y contradicciones.</p><h3>Las tres fases del diseño</h3><table><tr><th>Fase</th><th>Qué produce</th><th>Pregunta guía</th></tr><tr><td>Análisis</td><td>Requisitos y reglas del negocio (ERS).</td><td>¿Qué información se necesita y qué reglas debe cumplir?</td></tr><tr><td>Diseño conceptual</td><td>Modelo E/R o E/R extendido, independiente de una tecnología concreta.</td><td>¿Qué cosas existen y cómo se relacionan?</td></tr><tr><td>Diseño lógico</td><td>Esquema relacional de tablas, claves y restricciones.</td><td>¿Cómo se organiza en el modelo elegido?</td></tr><tr><td>Diseño físico</td><td>Implementación en un SGBD específico, normalmente con DDL/SQL.</td><td>¿Cómo se crea y almacena realmente?</td></tr></table><div class="callout"><strong>Idea:</strong> primero entiende y modela el significado; después eliges tablas y detalles técnicos. No empieces creando tablas a ciegas.</div><h3>Cómo leer un enunciado</h3><ol><li>Subraya los sustantivos relevantes: candidatos a entidades o atributos.</li><li>Marca verbos que expresan asociaciones: candidatos a relaciones.</li><li>Busca frases de cantidad: “uno”, “varios”, “como máximo”, “exactamente uno”.</li><li>Busca tiempo e historia: “durante”, “desde/hasta”, “en la fecha”, “cada revisión”.</li><li>Busca excepciones y restricciones: “pero nunca”, “solo si”, “puede ser ambos”.</li><li>Decide qué debe conservarse como dato y qué puede calcularse.</li></ol><h3>Criterios de calidad</h3><p>Un buen esquema es completo (cubre requisitos), correcto (usa bien la notación), mínimo (no repite lo mismo), expresivo, legible, autoexplicativo y flexible para ampliaciones razonables. Revisa cada frase del enunciado contra el diagrama.</p>`},
{id:'conceptos-bd',icon:'▤',title:'Bases de datos y SGBD',short:'Datos, metadatos, modelos y tareas del gestor.',intro:'Antes del diagrama E/R, entiende qué es una base de datos y qué servicios proporciona su gestor.',body:`<h2>Dato, información y contexto</h2><p>Un dato es un hecho conocido que puede registrarse. Para constituir una base de datos debe relacionarse con otros datos y tener significado dentro de un contexto. “Fecha” puede ser fecha de factura o fecha de nacimiento: el modelo debe dejar claro de qué fecha se trata.</p><p>Una base de datos es una colección organizada de datos relacionados, compartida por varias aplicaciones o usuarios. Un <b>SGBD</b> es el software que permite definirla, crearla, mantenerla y dar acceso controlado.</p><h3>Ficheros tradicionales frente a BD</h3><table><tr><th>Ficheros aislados</th><th>Base de datos bien diseñada</th></tr><tr><td>Duplicación de datos, más almacenamiento y actualizaciones repetidas.</td><td>Menos redundancia evitable y fuentes comunes para las aplicaciones.</td></tr><tr><td>Las copias pueden contradecirse; los cambios son difíciles de propagar.</td><td>Restricciones de integridad y datos compartidos coherentes.</td></tr><tr><td>Programas muy ligados a sus archivos.</td><td>Mayor independencia entre datos y programas; metadatos describen la estructura.</td></tr></table><p>Una BD también tiene costes: instalación, administración, personal cualificado y una implantación que requiere planificación.</p><h3>Modelos de BD y vocabulario</h3><p>Los materiales describen modelos jerárquicos (árbol), en red (múltiples caminos), relacionales (tablas), multidimensionales (varias dimensiones) y orientados a objetos (tipos de objetos variados). Este curso se centra en el modelo relacional, al que llegamos desde el E/R.</p><p><b>Metadatos</b> son datos acerca de los datos: nombres, tipos, grupos, relaciones y restricciones. Una tabla contiene filas/registros/tuplas y columnas/campos/atributos. Una consulta pide recuperar o modificar información; un índice ayuda a encontrarla; una vista guarda una consulta como tabla virtual.</p><h3>Qué hace un SGBD</h3><ul><li><b>DDL:</b> define estructura, tipos y restricciones.</li><li><b>DML:</b> inserta, consulta, actualiza y elimina datos.</li><li><b>DCL:</b> controla permisos y seguridad.</li><li>Administra integridad, concurrencia de varios usuarios, recuperación ante fallos y catálogo/diccionario de datos.</li></ul><div class="callout"><strong>Cómo encaja:</strong> E/R modela significado; el modelo relacional organiza tablas; SQL/DDL crea la estructura concreta en el SGBD.</div>`},
{id:'entidades',icon:'▣',title:'Entidades, atributos y claves',short:'Distingue objetos, propiedades, identificadores y entidades débiles.',intro:'Una entidad representa algo sobre lo que hace falta almacenar datos; sus atributos describen sus ocurrencias.',body:`<h2>Entidad y ocurrencia</h2><p>Una <b>entidad</b> es una clase de objetos del mundo real o conceptual que interesa distinguir, como EMPLEADO, CURSO o DIAGNÓSTICO. Una ocurrencia es un ejemplar concreto. En la notación Chen, la entidad se dibuja como rectángulo; en el diseñador web aparece como una tarjeta que puedes mover.</p><h3>Fuerte y débil</h3><ul><li><b>Fuerte:</b> tiene una clave propia suficiente para identificar cada ocurrencia.</li><li><b>Débil:</b> no puede identificarse de manera independiente; su identidad depende de una entidad propietaria. Se identifica con la clave del propietario más un discriminador propio. Ejemplo: LINEA_PEDIDO identificada por (pedido, número_de_línea).</li></ul><p>La dependencia puede ser de <b>existencia</b> (si se elimina el propietario, la ocurrencia dependiente deja de tener sentido) y/o de <b>identificación</b> (necesita la clave del propietario para ser única). No supongas que toda relación 1:N crea una entidad débil: la debilidad depende de la identidad y del negocio.</p><h2>Atributos</h2><table><tr><th>Tipo</th><th>Qué significa</th><th>Ejemplo</th></tr><tr><td>Identificador / clave</td><td>Identifica de forma única; puede ser simple o compuesta.</td><td>DNI; (código_pedido, línea).</td></tr><tr><td>Alternativa</td><td>También identifica de forma única, pero no se eligió como clave principal.</td><td>Email corporativo único.</td></tr><tr><td>Descriptivo</td><td>Describe una propiedad del objeto o vínculo.</td><td>Nombre, color.</td></tr><tr><td>Discriminador</td><td>Distingue una débil dentro de su propietario.</td><td>Número de línea dentro de pedido.</td></tr><tr><td>Compuesto</td><td>Se descompone en partes con significado propio.</td><td>Dirección: calle, número, ciudad.</td></tr><tr><td>Multivaluado</td><td>Puede haber varios valores del mismo dominio.</td><td>Teléfonos de una persona.</td></tr><tr><td>Derivado</td><td>Se calcula a partir de otros datos.</td><td>Edad a partir de fecha de nacimiento.</td></tr><tr><td>Opcional</td><td>Puede faltar legítimamente; documenta cuándo.</td><td>Segundo apellido.</td></tr></table><div class="callout warn"><strong>No confundas:</strong> compuesto = un dato con subpartes; multivaluado = varios valores. “Varios teléfonos” es multivaluado, no compuesto.</div><h3>Cómo elegir una clave</h3><p>Busca una propiedad estable, única, obligatoria y mínima. Una clave compuesta es válida si ningún subconjunto suyo identifica por sí solo. No uses nombre como clave si puede repetirse o cambiar.</p><div class="formula">CLAVE PRIMARIA (PK): identifica una fila en su tabla\nCLAVE CANDIDATA: cualquier conjunto mínimo que podría ser PK\nCLAVE ALTERNATIVA: candidata no elegida como PK</div>`},
{id:'relaciones',icon:'◇',title:'Relaciones y grados',short:'Binarias, ternarias, recursivas, atributos y roles.',intro:'Una relación representa un hecho que asocia ocurrencias de una o más entidades.',body:`<h2>Grado y papel</h2><p>El <b>grado</b> es el número de participantes: binaria (2), ternaria (3) o n-aria (más de 2). El nombre verbal ayuda a expresar el hecho: EMPLEADO <i>imparte</i> EDICIÓN. Cuando la misma entidad participa en distintos papeles, nómbralos: EMPLEADO <i>supervisa</i> EMPLEADO (supervisor / supervisado).</p><ul><li><b>Binaria:</b> dos entidades; por ejemplo, CLIENTE compra PRODUCTO.</li><li><b>Ternaria:</b> un hecho indivisible entre tres; por ejemplo, PROVEEDOR suministra PIEZA para PROYECTO.</li><li><b>Recursiva/reflexiva:</b> una entidad se relaciona consigo misma, como CURSO tiene prerrequisito CURSO.</li><li><b>Atributo de relación:</b> depende de todas las entidades participantes. Por ejemplo, cantidad en CLIENTE–PRODUCTO; porcentaje de dedicación en EMPLEADO–PROYECTO.</li></ul><div class="callout"><strong>Regla práctica:</strong> si el dato describe la ocurrencia del vínculo y cambia al cambiar cualquiera de sus participantes, suele pertenecer a la relación. Si describe solo una entidad, va con esa entidad.</div><h3>Cuándo hace falta una ternaria</h3><p>Conserva la relación ternaria cuando el hecho solo tiene sentido considerando los tres papeles a la vez. Sustituirla por tres binarias puede inventar combinaciones que nunca ocurrieron. Pregúntate si las binarias permitirían responder la misma consulta sin ambigüedad; si no, conserva el grado 3.</p><p>Ejemplo: “la editorial publica este libro con este autor” es un hecho LIBRO–EDITORIAL–AUTOR. Registrar simplemente qué editorial publica cada libro y qué autores escriben libros puede perder qué autor colaboró con qué editorial en esa publicación.</p>`},
{id:'cardinalidades',icon:'↔',title:'Cardinalidades y participación',short:'Lee los mínimos y máximos sin confundirlos.',intro:'La participación (mínimo, máximo) expresa la regla completa; la cardinalidad resumida suele mostrar los máximos.',body:`<h2>Dos niveles que no debes mezclar</h2><p>Para cada extremo de una relación anota <b>(mínimo, máximo)</b>. El mínimo describe si participar es obligatorio (1) u opcional (0); el máximo describe cuántas participaciones se permiten (1 o N). La cardinalidad abreviada 1:1, 1:N o N:M resume principalmente los máximos. Por eso 1:N no nos dice por sí sola si algún lado puede quedar sin relación.</p><table><tr><th>Par</th><th>Lectura</th></tr><tr><td>(0,1)</td><td>Puede no participar; si participa, como máximo una vez.</td></tr><tr><td>(1,1)</td><td>Debe participar exactamente una vez.</td></tr><tr><td>(0,N)</td><td>Puede no participar o participar muchas veces.</td></tr><tr><td>(1,N)</td><td>Debe participar al menos una vez y puede hacerlo muchas veces.</td></tr></table><h3>Relaciones binarias</h3><table><tr><th>Cardinalidad</th><th>Lectura</th><th>Ejemplo orientativo</th></tr><tr><td>1:1</td><td>Un elemento de cada lado se asocia, como máximo, con uno del otro lado.</td><td>Persona–pasaporte (si cada uno solo puede tener uno).</td></tr><tr><td>1:N</td><td>Una ocurrencia de un lado puede asociarse con muchas del otro; cada ocurrencia del lado N se vincula como máximo con una del lado 1.</td><td>Departamento–Empleados.</td></tr><tr><td>N:M</td><td>Muchas de un lado con muchas del otro.</td><td>Empleado–Proyecto.</td></tr></table><h2>Cardinalidades de tres entidades en el Diseñador MER</h2><p>Tu diseñador admite relaciones con <b>tres extremos</b> y estas cardinalidades: <b>1:1:1, 1:1:N, 1:N:M y N:M:P</b>. El orden importa: cada letra/valor corresponde al extremo de la entidad conectada en ese orden. No leas “1:N:M” como tres cardinalidades binarias separadas; es un resumen de máximos para una única relación ternaria.</p><div class="callout blue"><strong>Lectura rigurosa:</strong> para un extremo, su máximo responde cuántas ocurrencias de esa entidad pueden aparecer para una combinación fija de las otras dos. En una ternaria, una misma ocurrencia puede relacionarse con muchas combinaciones distintas; por eso una ternaria no equivale automáticamente a tres binarias.</div><table><tr><th>Notación del diseñador</th><th>Extremo A</th><th>Extremo B</th><th>Extremo C</th><th>Ejemplo de lectura por pares</th></tr><tr><td><b>1:1:1</b></td><td>1</td><td>1</td><td>1</td><td>Fijados dos participantes, como máximo uno del tercero.</td></tr><tr><td><b>1:1:N</b></td><td>1</td><td>1</td><td>N</td><td>Una pareja A–B puede aparecer con varios C; A–C y B–C fijados, como máximo uno del otro lado marcado 1.</td></tr><tr><td><b>1:N:M</b></td><td>1</td><td>N</td><td>M</td><td>Con A fijo hay muchas parejas B–C; el 1 limita el número de A para cada pareja B–C.</td></tr><tr><td><b>N:M:P</b></td><td>N</td><td>M</td><td>P</td><td>Los tres extremos admiten muchos participantes respecto a las combinaciones de los otros dos.</td></tr></table><h3>Ejemplos didácticos (el orden está escrito junto a cada notación)</h3><ul><li><b>1:1:1 — MÉDICO–PACIENTE–TURNO:</b> para un turno y paciente hay como máximo un médico asignado; para un médico y turno, como máximo un paciente; para médico y paciente, como máximo un turno dentro del ámbito modelado. Úsalo solo si esas reglas realmente se cumplen.</li><li><b>1:1:N — EDITORIAL–LIBRO–AUTOR:</b> con una editorial y un libro se pueden asociar varios autores; manteniendo libro y autor, como máximo una editorial; manteniendo editorial y autor, como máximo un libro. Si el negocio permite coediciones repetidas o varias ediciones, añade el identificador/edición al modelo en vez de forzar la regla.</li><li><b>1:N:M — PROYECTO–PROVEEDOR–PIEZA:</b> para una pareja proveedor–pieza hay como máximo un proyecto registrado; un proyecto puede vincularse con muchos proveedores y muchas piezas según las parejas que se registran.</li><li><b>N:M:P — PROVEEDOR–PIEZA–PROYECTO:</b> cada proveedor puede suministrar muchas piezas para muchos proyectos, y cada pieza aparecer en muchos proyectos/proveedores.</li></ul><div class="callout warn"><strong>Antes de elegir:</strong> fija las otras dos entidades y formula la regla de “como máximo cuántas”. Si no puedes responderla sin ambigüedad, vuelve al enunciado, define el período/rol y vuelve a comprobar cada extremo. Los PDF estudian sobre todo binaria y ternaria; las cuatro etiquetas ternarias son las opciones específicas de tu web.</div><h3>Prueba rápida</h3><p>Para EMPLEADO–PROYECTO–TAREA, un porcentaje de dedicación depende de qué empleado participa en qué proyecto y tarea; si la dedicación solo es empleado–proyecto, no la pongas en una relación que también incluya tarea.</p>`},
{id:'debilidad-restricciones',icon:'⚑',title:'Entidades débiles y restricciones',short:'Dependencias, exclusividad, inclusión y agregación.',intro:'Estas reglas añaden significado que una cardinalidad sola no expresa.',body:`<h2>Dependencias</h2><p>Una entidad dependiente necesita la identidad o existencia de otra. Su clave suele combinar la clave propietaria con el discriminador propio. Al pasar a tablas, la clave del propietario queda como FK y forma parte de la PK de la débil. La eliminación del propietario debe respetar la política del negocio (por ejemplo, borrar en cascada solo cuando corresponde).</p><h2>Exclusividad e inclusión</h2><p>Las restricciones conectan participaciones de una misma entidad en dos relaciones; no son sinónimos de cardinalidad ni de jerarquía ISA.</p><table><tr><th>Regla</th><th>Significado</th><th>Frase disparadora</th></tr><tr><td>Exclusividad</td><td>Una ocurrencia participa en R1 o R2, pero no en ambas simultáneamente.</td><td>“O una cosa u otra, nunca las dos”.</td></tr><tr><td>Inclusividad</td><td>Puede participar en ambas; participar en R2 exige también haber participado en R1 (R2 implica R1).</td><td>“Para poder hacer B, antes/además debe hacer A”.</td></tr><tr><td>Exclusión</td><td>Restricción equivalente descrita sobre dos relaciones: no se permite compartir el mismo participante.</td><td>“No puede aparecer a la vez en ambas”.</td></tr><tr><td>Inclusión</td><td>Las participaciones de R2 deben estar contenidas en las de R1.</td><td>“Todo participante de B también está en A”.</td></tr></table><div class="callout">Ejemplo del examen de proyectos: cada empleado puede ser desarrollador o gerente, pero no ambos a la vez: jerarquía ISA exclusiva. Un proyecto solo puede aprobarse si fue revisado: el conjunto de aprobaciones debe estar incluido en las revisiones, y además solo puede aprobarlo un gerente.</div><h2>Agregación</h2><p>La agregación permite tratar una relación (y las entidades que participan en ella) como una unidad de nivel superior, para que esa unidad participe en otra relación. En el diseñador aparece como un recuadro de agregación. Úsala si una relación completa es objeto de otro hecho: por ejemplo, registrar que una persona supervisa la asignación concreta de un empleado a un proyecto, no simplemente el proyecto por separado.</p><div class="callout warn"><strong>Evita una agregación decorativa:</strong> debe resolver una regla que no puede expresarse con claridad conectando el hecho externo con una sola entidad participante.</div>`},
{id:'jerarquias',icon:'△',title:'Jerarquías ISA: especialización y generalización',short:'Total/parcial y exclusiva/solapada: las cuatro combinaciones.',intro:'ISA se lee “es un tipo de”. El subtipo hereda los atributos e identificador del supertipo.',body:`<h2>Superclase y subclase</h2><p>Una jerarquía E/R extendida organiza una entidad general (supertipo) en categorías más específicas (subtipos). Empleado–Desarrollador significa “cada Desarrollador es un Empleado”. Datos comunes como código, nombre y fecha de nacimiento pertenecen al supertipo; lenguajes conocidos pertenecen a Desarrollador; presupuesto de aprobación pertenece a Gerente.</p><p><b>Generalización</b> parte de varios tipos concretos y extrae lo común a un supertipo. <b>Especialización</b> parte de un tipo general y define subtipos con reglas específicas. La relación ISA es la misma; cambia la dirección del razonamiento.</p><h2>Dos ejes independientes</h2><table><tr><th>Eje</th><th>Opción</th><th>Pregunta</th></tr><tr><td>Cobertura</td><td><b>Total</b></td><td>¿Toda ocurrencia del supertipo pertenece a por lo menos un subtipo?</td></tr><tr><td>Cobertura</td><td><b>Parcial</b></td><td>¿Puede haber una ocurrencia que no pertenezca a ningún subtipo?</td></tr><tr><td>Solapamiento</td><td><b>Exclusiva / disjunta (d)</b></td><td>¿Puede pertenecer a más de un subtipo a la vez? No.</td></tr><tr><td>Solapamiento</td><td><b>Solapada (o)</b></td><td>¿Puede pertenecer a varios subtipos a la vez? Sí.</td></tr></table><h2>Las cuatro combinaciones</h2><table><tr><th>Combinación</th><th>Regla completa</th><th>Ejemplo</th></tr><tr><td>Total + exclusiva</td><td>Pertenece a exactamente un subtipo.</td><td>Empleado debe ser Gerente o Desarrollador, nunca ambos.</td></tr><tr><td>Total + solapada</td><td>Pertenece a uno o más subtipos.</td><td>Persona es miembro al menos de una categoría; puede tener varias certificaciones.</td></tr><tr><td>Parcial + exclusiva</td><td>Pertenece a cero o un subtipo.</td><td>Empleado puede ser Gerente, Desarrollador o no pertenecer a ninguno de esos dos.</td></tr><tr><td>Parcial + solapada</td><td>Pertenece a cero, uno o varios subtipos.</td><td>Empleado puede ser Técnico y Científico a la vez, o no estar en esos subtipos.</td></tr></table><div class="formula">TOTAL + EXCLUSIVA = exactamente uno\nTOTAL + SOLAPADA = uno o más\nPARCIAL + EXCLUSIVA = cero o uno\nPARCIAL + SOLAPADA = cero, uno o varios</div><h3>Cómo decidir sin adivinar</h3><ol><li>¿Puede existir un elemento del supertipo fuera de todos los subtipos? Sí → parcial. No → total.</li><li>¿Puede una misma ocurrencia pertenecer a dos subtipos al mismo tiempo? Sí → solapada; no → exclusiva.</li><li>Escribe la regla en castellano antes de marcarla en el triángulo ISA.</li></ol><p>En una jerarquía, los subtipos heredan la clave y atributos comunes; pueden añadir atributos y relaciones propios. Los tipos de jerarquía no cambian cardinalidades de relaciones ordinarias. En el diseñador, el diálogo de jerarquía permite elegir supertipo, subtipos, d/o y total/parcial.</p>`},
{id:'relacional',icon:'▦',title:'Del E/R al modelo relacional',short:'Tablas, PK/FK y reglas básicas de transformación.',intro:'El diseño lógico convierte entidades y relaciones en tablas con restricciones de integridad.',body:`<h2>Vocabulario relacional</h2><table><tr><th>Elemento</th><th>En tabla</th><th>Descripción</th></tr><tr><td>Relación</td><td>Tabla</td><td>Estructura con nombre y atributos.</td></tr><tr><td>Ocurrencia</td><td>Fila / tupla</td><td>Un registro concreto.</td></tr><tr><td>Atributo</td><td>Columna</td><td>Valor de un dominio.</td></tr><tr><td>PK</td><td>Clave primaria</td><td>Identifica la fila y no admite NULL.</td></tr><tr><td>FK</td><td>Clave foránea</td><td>Referencia la PK/clave candidata de otra tabla.</td></tr><tr><td>Clave candidata</td><td>Clave alternativa potencial</td><td>Identificador único y mínimo.</td></tr></table><h2>Reglas de transformación del material</h2><ul><li><b>Entidad:</b> una tabla; su identificador es PK. Claves alternativas conservan unicidad.</li><li><b>N:M:</b> siempre tabla de unión; las claves participantes son FKs y normalmente forman PK compuesta. Los atributos del vínculo van ahí.</li><li><b>1:N:</b> normalmente FK del lado 1 en tabla del lado N. Atributos del vínculo suelen ir junto a la FK. Si las participaciones hacen inviable evitar NULL u otro requisito lo aconseja, puede usarse tabla propia.</li><li><b>1:1:</b> ubica FK donde minimice NULL y respete obligatoriedad/uniqueness; en (0,1)-(0,1), una tabla de relación con unicidad puede ser conveniente.</li><li><b>Débil:</b> FK del propietario es además parte de PK; se suma discriminador.</li><li><b>Grado mayor que 2:</b> tabla propia con FKs a todas las entidades; conserva la asociación conjunta. Las restricciones específicas de clave deben corresponder a la cardinalidad ternaria.</li><li><b>Jerarquía ISA:</b> tabla para supertipo y para subtipos con datos/relaciones propios; clave del subtipo hereda la del supertipo. Algunas opciones dependen de total/exclusiva y de implementación.</li><li><b>Recursiva:</b> una 1:N puede ser una FK autorreferente; N:M necesita tabla de unión.</li></ul><div class="callout warn"><strong>La cardinalidad resumida no basta:</strong> al transformar, también comprueba mínimos, obligatoriedad, unicidad, participación débil y restricciones del negocio. Mantén la FK de acuerdo con las reglas del enunciado.</div><h3>Integridad</h3><p>La integridad de entidad exige PK única y no nula. La integridad referencial exige que cada valor FK encuentre una fila válida referenciada, o sea NULL solo si la participación lo permite.</p>`},
{id:'normalizacion',icon:'⟲',title:'Normalización: 1FN a 5FN',short:'Dependencias y anomalías para mejorar tablas.',intro:'Normalizar reduce redundancias y anomalías; el resumen del Tema 2 incluye hasta quinta forma normal.',body:`<h2>¿Por qué normalizar?</h2><p>La repetición puede provocar anomalías al insertar, actualizar o borrar. Si la tabla está construida a partir de un buen diseño conceptual E/R, muchas anomalías ya se evitan desde el principio; aun así, se deben reconocer las formas normales.</p><h3>Dependencias</h3><ul><li><b>Funcional A → B:</b> cada valor de A determina un único valor de B.</li><li><b>Completa:</b> el atributo depende de toda la clave compuesta, no de una parte.</li><li><b>Transitiva:</b> A determina B y B determina C, por lo que A determina C a través de B.</li><li><b>Multivaluada A →→ B:</b> un valor de A determina un conjunto independiente de valores B.</li></ul><table><tr><th>Forma</th><th>Regla</th><th>Qué buscar</th></tr><tr><td>1FN</td><td>Todos los atributos son atómicos.</td><td>Listas de teléfonos dentro de una celda.</td></tr><tr><td>2FN</td><td>Está en 1FN y cada atributo no clave depende de la clave completa.</td><td>En PK (DNI, Curso), NombreAlumno depende solo de DNI.</td></tr><tr><td>3FN</td><td>Está en 2FN y no hay dependencias transitivas de atributos no clave sobre la clave.</td><td>DNI → Localidad → Provincia.</td></tr><tr><td>FNBC</td><td>Versión más estricta de 3FN: cada determinante relevante es clave candidata.</td><td>Dependencias con claves candidatas compuestas que se solapan.</td></tr><tr><td>4FN</td><td>Está en 3FN/FNBC y no conserva dependencias multivaluadas independientes impropias.</td><td>Alumno tiene asignaturas y deportes independientes → dos tablas.</td></tr><tr><td>5FN</td><td>Las dependencias de unión no triviales están implicadas por claves candidatas.</td><td>Descomponer relaciones ternarias solo cuando la recomposición es correcta y no inventa tuplas.</td></tr></table><div class="callout"><strong>Atajo memorable:</strong> 1FN: un valor por celda; 2FN: toda la clave; 3FN: nada depende de otro dato no clave; FNBC: todo determinante es clave; 4FN: separa multivaluados independientes; 5FN: toda descomposición de unión queda justificada por claves.</div><p>La definición de FNBC y los ejemplos pueden presentarse con distinto nivel de rigor en distintos cursos. Para tus ejercicios, usa la formulación y notación enseñadas por tu profesor y explica las dependencias que justifican cada descomposición.</p>`}
];
const exercises=[
{title:'Formación de empleados',tag:'Relaciones recursivas · débil · exclusividad',source:'Ejercicios.pdf · caso 1',prompt:'La empresa organiza cursos con código, nombre, descripción, horas y coste. Un curso puede ser prerrequisito obligatorio o recomendado de otros. Cada curso tiene ediciones en lugar, fechas y horario. En una misma fecha de inicio solo hay una edición de ese curso. Empleados (código, nombre, dirección, teléfono, NIF, nacimiento, nacionalidad, sexo, firma, salario) pueden impartir y/o asistir a ediciones, pero la misma persona no puede hacer ambas cosas en la misma edición. Registrar si puede impartir.',hint:'Distingue CURSO de su EDICIÓN. El prerrequisito es una relación recursiva con atributo “tipo”. El rol de docente/alumno cambia por edición, no para siempre en EMPLEADO.',solution:'Entidades: EMPLEADO(cod_empleado PK, NIF alternativo si es único, datos personales); CURSO(cod_curso PK, nombre, descripción, horas, coste); EDICIÓN con fecha_inicio, lugar, horario, dependiente de CURSO si se identifica con curso+fecha. Relaciones: CURSO tiene EDICIÓN (1:N); CURSO es_prerrequisito_de CURSO (recursiva N:M, atributo obligatorio/recomendado); EMPLEADO imparte EDICIÓN (M:N o N:1 según regla de una edición); EMPLEADO asiste EDICIÓN (N:M). La misma pareja empleado-edición no puede estar en imparte y asiste: exclusividad entre ambas participaciones. “Puede impartir” es un atributo booleano de empleado o, si hay cualificación histórica, entidad de capacidad. Aclarar si cada edición tiene uno o varios docentes.'},
{title:'Club hípico',tag:'Ternaria · historia · estado de participación',source:'Ejercicios.pdf · caso Club Hípico',prompt:'El club controla caballos, dueños, jinetes, preparadores y carreras por jornada. Quiere saber los caballos/jinetes inscritos y quién llega primero, segundo y tercero. A veces caballo o jinete inscrito no llega a participar. Hay que conservar el dueño del caballo cuando corrió cada carrera. Interesan preparadores del caballo.',hint:'Separar inscripción de participación efectiva evita perder los abandonos previos. El dueño actual no responde necesariamente quién era dueño en el pasado.',solution:'Entidades: CABALLO, PERSONA/DUEÑO, JINETE, PREPARADOR, CARRERA y JORNADA/EDICIÓN si tiene datos propios. Una inscripción para carrera suele ser el hecho ternario CARRERA–CABALLO–JINETE; añade estado (inscrito, baja previa, participó) y, solo si efectivamente corrió, posición/resultados. Registra identidad del dueño al inscribir/correr o modela PROPIEDAD con fecha_desde/hasta para histórico; fija cuál necesita el enunciado. Carrera–Jornada (N:1). Caballo–Preparador puede ser N:M con intervalo temporal, si se requiere historia. Un caballo puede tener varios preparadores; no atribuyas el resultado del caballo solo al caballo si depende de la carrera concreta.'},
{title:'Hospital y pacientes',tag:'ISA · temporalidad · entidad dependiente',source:'Ejercicios.pdf · supuesto hospital',prompt:'Guardar enfermos con código, nombre, DNI, nacimiento, contacto; trabajadores médicos/enfermeras con datos comunes; médicos tienen especialidad. Pacientes ocupan habitaciones desde fecha de ingreso hasta salida; una habitación puede alojar varios pacientes a lo largo del tiempo y se guarda planta, camas y observaciones. Médicos curan a varios enfermos; enfermeras se asignan a una planta. Cada diagnóstico tiene fecha, informe y código, lo emite un médico, es de una enfermedad y debe formar la historia clínica.',hint:'“Edad” puede derivarse de nacimiento. Habitación asignada “en la fecha” requiere conservar intervalo/historia; no basta una FK actual si se consultan ingresos pasados.',solution:'Entidades: PACIENTE, TRABAJADOR(superentidad), MÉDICO y ENFERMERA subtipos si comparten identidad/datos; MÉDICO añade especialidad; HABITACIÓN, PLANTA, ENFERMEDAD. DIAGNÓSTICO puede identificarse por paciente+num/fecha si su código no es global. PLANTA–HABITACIÓN 1:N; ENFERMERA–PLANTA según “una planta por enfermera” 1:N; MÉDICO–PACIENTE relación de curación N:M si varios médicos pueden atender al paciente. DIAGNÓSTICO pertenece a un paciente, lo emite un médico y refiere una enfermedad. Asignación/ingreso paciente-habitación lleva fechas y es temporal; controlar solapamiento de camas como regla adicional. No almacenar edad si se calcula de fecha_nacimiento, salvo requisito de edad histórica a fecha de ingreso.'},
{title:'Empresa de proyectos de software',tag:'Jerarquía ISA · recursiva · inclusión',source:'Ejercicios.pdf · examen de proyectos',prompt:'Empleados se dividen en Desarrolladores y Gerentes; no pueden ser ambos. El desarrollador domina varios lenguajes; el gerente tiene presupuesto máximo. Empleados participan en proyectos con porcentaje de dedicación. Cada proyecto tiene exactamente un gerente director y varias tareas. Tarea se identifica dentro del proyecto, puede tener prerrequisitos. Proyectos generan documentos con revisiones. Se asigna personal para revisarlos; solo gerente aprueba y solo se aprueba tras revisión.',hint:'“Se divide en” normalmente sugiere cobertura total: verifica si el enunciado permite otros empleados. ¿Qué clave identifica TAREA? Distingue revisión (hecho) de aprobación (otro hecho condicionado).',solution:'EMPLEADO(código PK) ISA total y exclusiva GERENTE / DESARROLLADOR; idiomas desarrollador multivaluados o entidad LENGUAJE relacionada. PROYECTO(código PK); DEDICACIÓN EMPLEADO–PROYECTO N:M con porcentaje. DIRIGE: GERENTE (0,N)–PROYECTO (1,1). TAREA es débil/dependiente de PROYECTO con PK (proyecto, id_tarea); PROYECTO contiene TAREA 1:N. PRERREQUISITO es recursiva N:M en TAREA. DOCUMENTO pertenece a un proyecto 1:N. REVISIÓN depende de DOCUMENTO, con versión/fecha/comentarios, y la realiza personal. APROBACIÓN solo por GERENTE; restricción inclusión: aprobación implica que existe revisión previa del documento. Considerar si varias revisiones/aprobaciones y quién puede aprobar cada una.'},
{title:'Hinchas del Betis: mundial y estadios',tag:'Claves compuestas · historia · relaciones',source:'Ejercicios.pdf · caso Hinchas del Betis',prompt:'Registrar partidos con fecha, fase, duración, árbitro, equipos y estadio. Los equipos tienen jugadores; el número de camiseta identifica al jugador dentro de su equipo, pero no mundialmente. Los árbitros pueden reemplazarse por lesión. Un estadio puede albergar muchos partidos. Se registran hinchas por partido, ticket, asiento, ropa y transporte.',hint:'El número de camiseta es clave parcial, no PK global. Capacidad ocupada y policías cambian por partido en ese estadio: son atributos del vínculo estadio-partido.',solution:'EQUIPO(clave/nombre único), JUGADOR con clave (equipo, número_camiseta), PARTIDO(id PK, fecha, fase, duración), ÁRBITRO(pasaporte PK), ESTADIO, HINCHA (según identificación útil). JUGADOR pertenece a EQUIPO 1:N. PARTIDO–EQUIPO N:M con rol (local/visitante) y regla exactamente dos equipos por partido. ESTADIO–PARTIDO 1:N; capacidad ocupada y policías, si son los del evento, van en la relación/asignación del estadio al partido. ÁRBITRO–PARTIDO según máximo del árbitro por partido; un árbitro puede dirigir varios partidos. Reemplazo es recursiva en ÁRBITRO, con roles reemplazante/reemplazado y cardinalidades según frase (un reemplazado es sustituido por uno o varios; cada reemplazante sustituye a un solo árbitro). HINCHA asiste a PARTIDO N:M con ticket, asiento, ropa y medio de transporte en la asistencia; definir ticket único por partido.'},
{title:'Grand Slam y estadísticas de tenis',tag:'Relaciones ternarias · atributos del hecho',source:'Ejercicios.pdf · conjunto de consultas',prompt:'La BD debe contestar partidos por año/torneo con composición y resultado; árbitros participantes; premios ganados por jugador a lo largo del torneo; entrenadores del jugador y fechas; campeones por país/año; parejas que jugaron dobles mixtos.',hint:'Un premio percibido depende de jugador + edición del torneo + modalidad/resultado. La fecha en que un entrenador entrena a un jugador pertenece a su vínculo histórico.',solution:'Entidades: TORNEO, EDICIÓN(año), PARTIDO, JUGADOR, PAÍS, ÁRBITRO, ENTRENADOR, MODALIDAD. PARTIDO pertenece a edición y tiene fase/resultado; jugadores participan con papel (individual/dobles, lado/equipo). ARBITRA puede ser N:M con partido si hay varios árbitros por partido. ENTRENA (entrenador–jugador) N:M con desde/hasta. PREMIO en la asociación jugador–edición–modalidad o como entidad PREMIO asociada al resultado, con importe/moneda. CAMPEÓN relaciona jugador/equipo con edición y modalidad. Pareja de dobles requiere modelar participantes/rol sin perder parejas ni edición.'},
{title:'Videoclub AGUADULCE',tag:'Entidades débiles · recursiva · límite de participación',source:'Entidad_relación_rev1.pdf · enunciado Videoclub',prompt:'La cadena AGUADULCE guarda películas (título, nacionalidad, productora, fecha). En una película participan varios actores (nombre, nacionalidad, sexo), algunos como principales. Una película tiene uno o más ejemplares, numerados dentro de esa película y con estado de conservación. Un ejemplar puede estar alquilado a un cliente (nombre, dirección, teléfono), con fecha de comienzo y devolución. Cada socio puede alquilar como máximo cuatro ejemplares. Un socio debe ser avalado por otro socio que responde por él.',hint:'Distingue PELÍCULA de cada copia física. “Número de ejemplar” puede ser discriminador. La relación avala es recursiva con roles avalista/avalado. El límite de cuatro es una restricción adicional de participación, no un tipo de cardinalidad usual.',solution:'PELÍCULA(título u otro id PK, nacionalidad, productora, año); EJEMPLAR débil con PK (película, número_ejemplar), estado. ACTOR con clave real (si el enunciado no aporta DNI, declara supuesto). ACTÚA es N:M y “principal” puede ser atributo del vínculo. DIRECTOR–PELÍCULA puede ser 1:N si se asume un director por película; el enunciado dice “un director”, pero aclara si puede codirigir. CLIENTE/SOCIO se identifica con id asignado; ALQUILER une socio con ejemplar y guarda desde/hasta, conservando historial. La participación activa puede limitarse a cuatro alquileres por socio. AVALA es recursiva entre socios, con roles; el mínimo/máximo del avalista y del avalado debe deducirse o declararse como supuesto.'},
{title:'Gimnasio “Siempre en forma”',tag:'ISA · sala especializada · reservas',source:'Entidad_relación_rev1.pdf · enunciado Gimnasio',prompt:'Hay salas con número, metros cuadrados, ubicación y tipo (cardio/general/muscular). Algunas contienen aparatos; cada aparato pertenece a una sala y tiene código, descripción y estado. En algunas salas se imparten clases; cada clase tiene código, descripción, día/hora, una sala y un monitor. De cada monitor: DNI, nombre, teléfono, titulación, experiencia y tipos de clase que puede impartir. De cada socio: número, nombre, dirección, teléfono, profesión y datos bancarios, además de las clases a las que asiste. Hay pistas de squash con número, ubicación y estado; son salas y se reservan por socios en fecha y hora. Las clases solo se imparten en salas sin aparatos.',hint:'“Las pistas se consideran salas” sugiere una posible jerarquía ISA SALA→PISTA_SQUASH. El requisito puede resolverse también con atributo tipo si las reglas fueran simples; explica la opción elegida.',solution:'SALA(num PK, metros, ubicación, tipo); APARATO(código PK) pertenece a una sala (cada aparato en una única sala; sala puede tener 0..N). CLASE(código PK, descripción, día/hora) se programa en una sala sin aparatos y la imparte un monitor; SOCIO asiste a CLASE (N:M). MONITOR(DNI PK, nombre, teléfono, titulación, experiencia) puede impartir tipos de clase; si los tipos son múltiples, relación/entidad TIPO_CLASE. PISTA_SQUASH puede ser subtipo de SALA con ISA parcial o total según si toda sala es pista (normalmente parcial); hereda número/ubicación/estado. RESERVA une socio con pista y fecha/hora, y puede tener su identificador (pista+fecha+hora) si no se repite. Regla de incompatibilidad: sala con aparatos no puede tener clase; exprésala como restricción del negocio.'},
{title:'Farmacia',tag:'Relaciones · movimientos · jerarquía',source:'Entidad_relación_rev1.pdf · enunciado Farmacia',prompt:'La farmacia cataloga medicamentos con código, nombre, tipo, stock, ventas y precio; hay medicamentos de venta libre y otros solo con receta. Cada medicamento se compra a un laboratorio o lo fabrica la propia farmacia. Se conocen laboratorios (código, nombre, teléfono, dirección, fax y contacto). Los medicamentos se agrupan por familia de enfermedades para ofrecer sustitutos similares de otro laboratorio. Algunos clientes pagan pedidos a fin de mes; hay que registrar unidades de cada medicamento comprado (con o sin crédito) y fecha de compra. Para clientes con crédito se guardan datos bancarios y fecha de pago.',hint:'Compra y venta son transacciones; stock vendido puede ser derivado de movimientos. No dupliques fabricante si se decide que un medicamento solo tiene un laboratorio o es propio; refleja la alternativa del enunciado.',solution:'MEDICAMENTO(código PK, nombre, tipo, precio actual, familia FK); LABORATORIO(código PK, contacto); FAMILIA; CLIENTE (id y datos); COMPRA/VENTA como ocurrencia transaccional y LÍNEA con unidades, medicamento y precio/fecha aplicable. MEDICAMENTO tiene proveedor laboratorio opcional si es fabricación propia; regla alternativa: exactamente un laboratorio o fabricante propio. VENTA_LIBRE/CON_RECETA podría ser atributo o ISA exclusiva y total solo si las dos categorías cubren todos los medicamentos y no se solapan; el enunciado dice “hay… y otros”, así que confirma cobertura. Crédito puede ser subtipo de CLIENTE si es condición persistente del cliente; datos bancarios solo de ese subtipo. Fecha de pago pertenece a compra/venta a crédito, no al medicamento. Familia puede asociar varios fármacos y describir equivalencia terapéutica.'},
{title:'Biblioteca: editorial, libro y autor',tag:'Ternaria · publicación',source:'Ejemplo ternario del resumen',prompt:'Una biblioteca necesita registrar que una editorial publicó un libro escrito por uno o más autores. Se quiere consultar autores por libro y editoriales por autor. Analiza si basta con tres binarias.',hint:'Define qué significa exactamente “publicó”: ¿la publicación es una edición del libro? Una edición puede evitar confundir una misma obra en editoriales/fechas distintas.',solution:'Modela LIBRO/OBRA, EDITORIAL y AUTOR, y una relación ternaria PUBLICA/EDICIÓN si el hecho es conjunto. Si interesa ISBN, idioma, fecha o número de edición, puede ser una entidad EDICIÓN con su clave y relaciones según las reglas. No asignes una cardinalidad ternaria sin reglas textuales para cada pareja; el ejemplo de grado 3 ilustra el grado, pero no fija automáticamente 1:1:N. Cada extremo debe justificarse con “fijados los otros dos…”.'},
{title:'Clínica de turnos: cardinalidad ternaria',tag:'1:1:1 · interpretar extremos',source:'Práctica creada para las cardinalidades de la web',prompt:'En el ámbito de una cita reservada, cada combinación de MÉDICO y HORARIO asigna como máximo un PACIENTE; cada pareja PACIENTE–HORARIO tiene como máximo un MÉDICO; cada pareja PACIENTE–MÉDICO tiene como máximo un HORARIO. Dibuja la ternaria y marca el orden MÉDICO:PACIENTE:HORARIO.',hint:'Lee las tres reglas por pares. Si alguna regla cambia, la cardinalidad resumen deja de ser 1:1:1.',solution:'La ternaria se representa como CITA/ASIGNA(MÉDICO, PACIENTE, HORARIO), con máximo 1 en cada extremo para las parejas de los otros dos participantes: 1:1:1 en el orden dado. Añade mínimos por separado (por ejemplo, una cita puede existir solo si están asignados los tres). Si una persona puede tener varias citas con el mismo médico, un identificador de cita/fecha es necesario en el ámbito correcto.'},
{title:'Proveedores, piezas y proyectos',tag:'1:N:M · tres extremos',source:'Práctica creada para las cardinalidades del diseñador',prompt:'Usa el orden PIEZA:PROVEEDOR:PROYECTO. Para cada combinación fija de PROVEEDOR y PROYECTO se registra como máximo una PIEZA. Para una combinación fija de PIEZA y PROYECTO pueden participar varios PROVEEDORES. Para una combinación fija de PIEZA y PROVEEDOR pueden aparecer varios PROYECTOS. ¿Qué notación ternaria representa esas tres reglas?',hint:'La primera regla limita PIEZA cuando las otras dos están fijadas. La segunda limita PROVEEDOR cuando PIEZA y PROYECTO están fijados. La tercera limita PROYECTO cuando PIEZA y PROVEEDOR están fijados.',solution:'En el orden PIEZA:PROVEEDOR:PROYECTO, los máximos son 1:N:M. A diferencia de una relación binaria, cada máximo se interpreta para la pareja restante fijada. La asociación almacena qué proveedor suministra qué pieza para qué proyecto.'},
{title:'Taller ternario abierto',tag:'N:M:P · crear y justificar',source:'Práctica para el diseñador web',prompt:'Modela ASIGNACIÓN con TÉCNICO, VEHÍCULO y TURNO. El enunciado dice que técnicos trabajan en distintos vehículos y turnos, que cada vehículo pasa por varios técnicos/turnos, y que un turno contiene varios técnicos y vehículos. Escribe por qué necesitas la relación ternaria y formula un supuesto para N:M:P.',hint:'La descripción aporta “muchos” en los tres extremos; formula la cardinalidad como regla de combinación, no como número de ocurrencias totales.',solution:'Con el supuesto de que para cada pareja fija de las otras dos entidades pueden aparecer varias ocurrencias del extremo, los máximos son N:M:P. El hecho es la asignación técnico–vehículo–turno; añade inicio/fin/resultado si son propios del evento. Define una clave de la asociación (por ejemplo, las tres FKs más un ordinal/instante si puede repetirse la misma combinación). Si la combinación solo puede registrarse una vez, las tres FKs pueden ser PK compuesta.'}
];

const glossary=[['Agregación','Abstraer una relación completa como unidad dentro de otra relación.'],['Atributo','Propiedad de una entidad o de una relación.'],['Atributo derivado','Dato calculable a partir de otros datos.'],['Atributo multivaluado','Atributo que puede almacenar varios valores de su dominio por ocurrencia.'],['Cardinalidad','Resumen de los máximos de participación (p. ej., 1:N); en la web también se eligen etiquetas ternarias.'],['Clave candidata','Conjunto mínimo de atributos que identifica unívocamente.'],['Discriminador','Atributo(s) que identifica una ocurrencia débil dentro de su propietario.'],['Entidad','Clase de cosas sobre las que se necesita información.'],['Entidad débil','Entidad que requiere la clave de otra para existir o identificarse.'],['Esquema relacional','Conjunto de tablas, atributos, claves y restricciones.'],['Especialización','Definir subtipos a partir de un supertipo.'],['Exclusiva / disjunta','No permite que una ocurrencia pertenezca simultáneamente a dos subtipos o relaciones marcadas.'],['FK','Clave foránea que referencia una clave de otra tabla.'],['Generalización','Encontrar atributos comunes y abstraerlos en un supertipo.'],['Grado','Número de entidades participantes en una relación.'],['Inclusión','Las ocurrencias de una relación deben pertenecer también a otra relación.'],['ISA','Relación “es un tipo de”; los subtipos heredan del supertipo.'],['Jerarquía total','Toda ocurrencia del supertipo cae en al menos un subtipo.'],['PK','Clave primaria que identifica cada fila.'],['Participación','Mínimo y máximo de ocurrencias relacionadas para una ocurrencia dada.'],['Relación','Asociación entre ocurrencias de entidades.'],['Relación recursiva','Relación en que una entidad participa más de una vez con roles distintos.'],['Relación ternaria','Un mismo hecho asocia tres entidades a la vez.'],['Solapada','Permite pertenecer a varios subtipos simultáneamente.'],['Supertipo / subtipo','Categoría general / categoría más específica que hereda propiedades.']];

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)nav(b.dataset.page)});
function home(){let pct=Math.round(state.done.length/lessons.length*100);return `<section class="hero"><div class="eyebrow">Curso interactivo · Modelo E/R extendido</div><h1>Aprende a diseñar modelos con sentido.</h1><p>Teoría paso a paso, cardinalidades ternarias, jerarquías ISA, ejercicios guiados basados en tus apuntes y exámenes autocorregibles. Funciona sin conexión.</p><div class="hero-actions"><button class="btn white" data-go="theory">Empezar por la teoría →</button><button class="btn ghost" data-go="practice">Ir a ejercicios</button></div></section><div class="grid stats"><div class="stat"><div class="num">${lessons.length}</div><small>módulos de teoría</small></div><div class="stat"><div class="num">${exercises.length}</div><small>ejercicios guiados</small></div><div class="stat"><div class="num">${questions.length}</div><small>preguntas de examen</small></div><div class="stat"><div class="num">${pct}%</div><small>teoría completada</small></div></div><div class="section-head"><div><h2>Ruta recomendada</h2><p>Avanza en orden y después practica con enunciados largos.</p></div></div><div class="grid module-grid">${lessons.slice(0,3).map((l,i)=>lessonCard(l,i)).join('')}</div><div class="section-head"><div><h2>Domina el E/R extendido</h2><p>Estos son los temas centrales del curso.</p></div></div><div class="grid module-grid">${lessons.slice(3).map((l,i)=>lessonCard(l,i+3)).join('')}</div><div class="callout"><strong>Un buen hábito:</strong> cada vez que veas “muchos”, pregunta “¿muchos para quién y con cuáles otras entidades fijadas?”. Esto evita errores de cardinalidad.</div>`}
function lessonCard(l,i){return `<article class="card"><div class="card-icon">${l.icon}</div><h3>${i+1}. ${l.title}</h3><p>${l.short}</p><div class="progressline"><i style="width:${state.done.includes(l.id)?100:0}%"></i></div><div class="meta">${state.done.includes(l.id)?'✓ Completado':'Módulo de estudio'}</div><button class="linkbtn" data-lesson="${i}">Abrir módulo →</button></article>`}
function theory(){return `<div class="lesson-head"><div class="eyebrow">Teoría</div><h1>Curso de modelado E/R y E/R extendido</h1><p>Empieza por los fundamentos, estudia las reglas y termina con normalización. Cada módulo incluye ejemplos y errores frecuentes.</p></div><div class="grid module-grid">${lessons.map((l,i)=>lessonCard(l,i)).join('')}</div><h2 style="margin-top:34px">Cómo resolver un ejercicio completo</h2><div class="panel prose" style="padding:20px"><ol><li>Lee y separa requisitos en objetos, datos, hechos y reglas.</li><li>Identifica entidades, claves y atributos (incluidos multivaluados, compuestos o derivados).</li><li>Nombra relaciones, grado y roles; detecta relaciones recursivas y atributos propios.</li><li>Para cada extremo, establece (mínimo, máximo); después resume cardinalidad.</li><li>Detecta dependencias, restricciones entre relaciones y jerarquías ISA.</li><li>Dibuja el esquema y verifica que cubre cada frase del enunciado sin duplicar hechos.</li><li>Si piden modelo relacional, convierte usando PK, FK y reglas adecuadas.</li></ol></div>`}
function lessonPage(i){let l=lessons[i];return `<div class="lesson-head"><div class="eyebrow">Módulo ${i+1} de ${lessons.length}</div><h1>${l.icon} ${l.title}</h1><p>${l.intro}</p><div class="progressline"><i style="width:${Math.round(state.done.length/lessons.length*100)}%"></i></div></div><div class="lesson-nav">${lessons.map((x,j)=>`<button class="${i===j?'active':''}" data-lesson="${j}">${j+1}. ${x.title}</button>`).join('')}</div><article class="prose">${l.body}</article><div class="lesson-bottom"><button class="btn" data-lesson="${Math.max(0,i-1)}">← ${i?lessons[i-1].title:'Inicio'}</button><button class="btn primary" data-done="${l.id}">${state.done.includes(l.id)?'✓ Módulo completado':'Marcar como completado'}</button><button class="btn" data-lesson="${Math.min(lessons.length-1,i+1)}">${i<lessons.length-1?lessons[i+1].title:'Volver al curso'} →</button></div>`}
function practice(){return `<div class="lesson-head"><div class="eyebrow">Practicar</div><h1>Ejercicios guiados</h1><p>Escribe tu propuesta antes de abrir la guía. Las respuestas son esquemas orientativos: explica supuestos y valida todas las reglas del enunciado.</p></div><div class="callout warn"><strong>Cómo usar las soluciones:</strong> hay más de un modelo correcto cuando se declaran supuestos razonables. Compara cobertura, claves, mínimos/máximos, atributos de relación y justificación; no copies una cardinalidad sin leer la regla.</div><div class="grid exercise-grid">${exercises.map((x,i)=>`<details class="card exercise" data-ex="${i}"><summary><span class="pill">${x.tag}</span><h3>${i+1}. ${x.title}</h3><p>${x.source}</p></summary><div class="exercise-body"><div class="prompt"><b>Enunciado</b><br>${x.prompt}</div><div class="hintbox"><b>Pista</b><br>${x.hint}</div><label class="mini" for="ans${i}">Tu propuesta (se guarda en este ordenador)</label><textarea class="answer" id="ans${i}" data-answer="${i}" placeholder="Entidades, claves, relaciones, cardinalidades y reglas…">${escapeHtml(state.answers[i]||'')}</textarea><p><button class="btn" data-toggle-solution="${i}">Ver guía de solución</button></p><div class="solution" id="solution${i}" hidden><b>Guía orientativa</b><br>${x.solution}</div></div></details>`).join('')}</div><div class="section-head"><div><h2>Mini ejercicios: pon a prueba una regla</h2><p>Responde oralmente o en una hoja y explica tu razonamiento.</p></div></div><div class="panel prose" style="padding:20px"><ol><li>En EMPLEADO–PROYECTO, ¿dónde colocarías el porcentaje de dedicación y por qué?</li><li>¿“Tiene teléfono” es compuesto o multivaluado si una persona puede tener varios números?</li><li>Una factura tiene líneas numeradas solo dentro de la factura. ¿Qué clave candidata usarías para LINEA?</li><li>Si todo trabajador es médico o enfermero, pero nunca ambas cosas, ¿qué dos propiedades ISA aplicarías?</li><li>Si alguien puede ser técnico y científico a la vez, ¿la jerarquía es exclusiva o solapada?</li><li>Un cliente puede no realizar pedidos; un pedido debe pertenecer a un solo cliente. Escribe los pares mínimos/máximos.</li><li>Un mismo curso puede ser prerrequisito de muchos cursos y tener muchos prerrequisitos. ¿Qué tipo de relación y qué roles nombrarías?</li><li>Para A–B–C con 1:1:N en ese orden, explica qué limita cada 1 usando una pareja fija.</li><li>¿Por qué el dueño actual de un caballo no basta para responder quién era su dueño en una carrera pasada?</li><li>¿Qué atributos de la visita de un hincha al partido pertenecen a la asistencia y no al hincha?</li><li>¿Cuándo la relación PROVEEDOR–PIEZA–PROYECTO debe conservarse ternaria?</li><li>¿Cuál es la diferencia entre inclusión de relaciones y jerarquía total?</li></ol></div>`}
function exam(){return `<div class="lesson-head"><div class="eyebrow">Evaluación</div><h1>Examen de teoría</h1><p>${questions.length} preguntas de opción múltiple. Elige una respuesta por pregunta y corrige para ver puntuación y explicaciones. Puedes repetirlo.</p><div class="chips"><span class="chip">Mejor resultado: ${state.best}/${questions.length}</span><span class="chip">Temas: E/R, ISA, cardinalidades, relacional, FN</span></div></div><div class="exam-grid">${questions.map((q,i)=>`<section class="panel question" id="q${i}"><h3>${i+1}. ${q[0]}</h3>${q[1].map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" ${state.exam[i]==j?'checked':''}><span>${o}</span></label>`).join('')}<div class="mini" id="expl${i}"></div></section>`).join('')}</div><div class="result" id="examResult" hidden><strong id="scoreText"></strong><span id="scoreAdvice"></span></div><div style="margin-top:18px"><button class="btn primary" id="gradeExam">Corregir examen</button> <button class="btn" id="resetExam">Borrar respuestas</button></div><div class="section-head"><div><h2>Simulacro práctico</h2><p>Se puntúa la calidad del razonamiento, no una sola lista rígida de cajas.</p></div></div><div class="panel prose" style="padding:20px"><span class="pill">Caso integrador · 35-50 min</span><h3>Centro de formación de la empresa</h3><p>Modela CURSO, EDICIÓN, EMPLEADO, DOCENTE, ALUMNO y CERTIFICADO. Un empleado puede impartir una edición y asistir a otra; nunca desempeña ambos papeles en la misma edición. Cada edición tiene fecha, lugar y horario. Un curso puede requerir otros. Al completar una edición se emite certificado con fecha y nota. Empleados se clasifican en personal técnico y administrativo; todo empleado pertenece a una de las dos clases y nunca a ambas.</p><ol><li>Haz inventario de entidades y atributos; marca claves y posibles entidades débiles.</li><li>Define relación recursiva CURSO–CURSO y sus atributos.</li><li>Escribe mínimo/máximo en cada extremo y cardinalidad resumida.</li><li>Modela impartir y asistir con exclusividad restringida a la misma edición.</li><li>Modela la jerarquía de empleados e indica cobertura/solapamiento.</li><li>Explica cómo convertirías N:M y entidad débil a relacional.</li></ol><h3>Rúbrica de autoevaluación · 10 puntos</h3><ul><li>Entidades y claves correctas: 2 puntos.</li><li>Atributos bien situados y tipos reconocidos: 1,5 puntos.</li><li>Relaciones, roles y grado, incluida recursiva: 2 puntos.</li><li>Cardinalidades y mínimos/máximos argumentados: 2 puntos.</li><li>ISA total/exclusiva y regla de exclusividad por edición: 1,5 puntos.</li><li>Legibilidad, ausencia de redundancia y revisión contra el texto: 1 punto.</li></ul><textarea class="answer" data-answer="mock" placeholder="Escribe tu análisis y guárdalo en este ordenador…">${escapeHtml(state.answers.mock||'')}</textarea></div>`}
function designer(){return `<div class="lesson-head"><div class="eyebrow">Guía de la web existente</div><h1>Qué hace el Diseñador MER</h1><p>La app de estudio explica y prepara práctica; tu Diseñador MER es la herramienta donde dibujas, guardas y exportas los modelos. Esta guía enumera sus funciones visibles y cómo aprovecharlas.</p></div><div class="grid module-grid"><article class="card"><div class="card-icon">▣</div><h3>Entidades y atributos</h3><p>Añade entidades fuertes o débiles, cambia el nombre, agrega/quita campos y marca identificadores. Puedes mover entidades y atributos en el lienzo.</p></article><article class="card"><div class="card-icon">◇</div><h3>Relaciones binarias y ternarias</h3><p>Crea relaciones entre entidades; conecta tres extremos y selecciona 1:1:1, 1:1:N, 1:N:M o N:M:P. Mantén el orden entidad-extremo coherente.</p></article><article class="card"><div class="card-icon">△</div><h3>Jerarquías ISA</h3><p>Elige supertipo, subtipos, exclusivas (d) o solapadas (o), y cobertura parcial o total. El triángulo representa “es un tipo de”.</p></article><article class="card"><div class="card-icon">▱</div><h3>Agregación</h3><p>Selecciona una relación y represéntala como unidad de nivel superior cuando otro hecho se refiere al vínculo completo.</p></article><article class="card"><div class="card-icon">↶</div><h3>Edición del diagrama</h3><p>Renombra el proyecto, selecciona elementos, arrastra por el lienzo, desplaza la vista, acerca/aleja, encaja el esquema y deshaz/rehaz cambios.</p></article><article class="card"><div class="card-icon">▤</div><h3>Modelos guardados</h3><p>Modelos permite guardar, abrir y eliminar modelos del navegador. Si configuras el servicio de PIN y accedes, también puedes guardar modelos en la nube compartida.</p></article><article class="card"><div class="card-icon">⇧</div><h3>JSON de entrada y salida</h3><p>Importa JSON para cargar entidades/relaciones y convertirlo en representación visual. Exporta JSON para conservar estructura y reimportarla.</p></article><article class="card"><div class="card-icon">⇩</div><h3>Imagen y documento</h3><p>Exporta el diagrama como JPG o PDF para compartirlo o estudiar. Revisa que todas las cajas y cardinalidades queden legibles antes de entregarlo.</p></article><article class="card"><div class="card-icon">☁</div><h3>Acceso con PIN entre equipos</h3><p>La sincronización remota depende de que el servicio compartido esté alojado con HTTPS y almacenamiento persistente. En cada ordenador se configura la misma URL y el mismo PIN; tras editar un modelo remoto, usa Guardar en la nube.</p></article></div><div class="callout warn"><strong>Importante:</strong> el PIN solo sincroniza modelos con el servicio compartido ya desplegado. Los modelos locales antiguos no se suben automáticamente; expórtalos/importa JSON y guarda una copia en la nube. La app Aula MER guarda su propio progreso local en este ordenador.</div><div class="panel prose" style="padding:20px"><h2>Flujo para crear un modelo</h2><ol><li>Usa Nuevo y escribe el nombre del sistema que vas a modelar.</li><li>Añade las entidades; define nombres, campos e identificadores.</li><li>Añade relaciones; comprueba cada cardinalidad y no olvides el mínimo (obligatorio/opcional) en tu razonamiento.</li><li>Añade jerarquías/agregación solo si existe una regla real que las justifique.</li><li>Revisa el diagrama contra el enunciado frase por frase; guarda una versión con nombre.</li><li>Exporta JSON para respaldo editable; JPG/PDF para entregar o revisar.</li></ol><p>En modelos con tres extremos, el diseñador coloca tres conexiones a una única relación. Asigna la cardinalidad a cada extremo según su orden en el diálogo y añade en tus apuntes las reglas por pares que justifican la notación ternaria.</p></div>`}
function glossaryPage(){let q=(document.getElementById('search').value||'').toLowerCase();let arr=glossary.filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));return `<div class="lesson-head"><div class="eyebrow">Consulta rápida</div><h1>Glosario</h1><p>Busca términos mientras resuelves un ejercicio. Usa el campo de búsqueda de la barra superior.</p></div><div class="grid term-grid">${arr.map(t=>`<article class="panel term"><strong>${t[0]}</strong><span>${t[1]}</span></article>`).join('')||'<div class="no-results">No hay términos que coincidan.</div>'}</div>`}
function sourcesPage(){return `<div class="lesson-head"><div class="eyebrow">Material de referencia</div><h1>Fuentes del curso</h1><p>La teoría y los casos prácticos se han sintetizado de los cuatro PDF que compartiste. Las soluciones de ejercicios son orientativas y explicitan supuestos cuando el enunciado admite más de un modelo.</p></div><div class="grid module-grid"><article class="card"><div class="card-icon">▤</div><h3>RESUMEN TEMA 2</h3><p>Fases de diseño, E/R, entidades, atributos, relaciones, cardinalidades, dependencias, restricciones, jerarquías, modelo relacional, transformación y normalización de 1FN a 5FN.</p></article><article class="card"><div class="card-icon">▦</div><h3>Gestión de Bases de Datos</h3><p>Conceptos generales de bases de datos y SGBD, datos, entidades, relaciones, claves e integridad referencial.</p></article><article class="card"><div class="card-icon">◇</div><h3>entidad_relación_rev1</h3><p>Notación y diseño E/R extendido, entidades fuertes y débiles, relaciones de distinto grado, cardinalidades, atributos, jerarquías, agregación, calidad y casos de práctica.</p></article><article class="card"><div class="card-icon">✎</div><h3>ejercicios</h3><p>Formación, club hípico, hospital, empresa de proyectos, mundial de fútbol y tenis Grand Slam; se usan para los ejercicios guiados y el simulacro.</p></article></div><div class="callout blue"><strong>Sobre cardinalidades ternarias:</strong> los cuatro valores 1:1:1, 1:1:N, 1:N:M y N:M:P, y la guía para asignarlos a los tres extremos, se documentan según las opciones del Diseñador MER que ya creaste. No se atribuyen a los PDF cuando estos no fijan esas cuatro opciones.</div><div class="panel prose" style="padding:20px"><h2>Convención de la app</h2><p>Las cardinalidades ternarias se escriben en el mismo orden que los tres extremos de la relación. Cada máximo se interpreta con las otras dos entidades fijadas. La participación mínima (0/1) se razona aparte; la etiqueta ternaria del diseñador no sustituye el análisis de mínimos.</p><p>El contenido resume y explica, no pretende reemplazar la notación particular de tu profesor. Si hay una diferencia de notación en clase, conserva el razonamiento y adapta el símbolo que te pidan.</p></div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let el=document.getElementById('content'),crumb=document.getElementById('crumb');let titles={home:'Inicio',theory:'Teoría',practice:'Ejercicios',exam:'Exámenes',designer:'La web Diseñador MER',glossary:'Glosario',sources:'Fuentes'};crumb.innerHTML=`<b>${titles[currentPage]||'Teoría'}</b>`;if(currentPage==='home')el.innerHTML=home();else if(currentPage==='theory')el.innerHTML=theory();else if(currentPage==='lesson')el.innerHTML=lessonPage(currentLesson);else if(currentPage==='practice')el.innerHTML=practice();else if(currentPage==='exam')el.innerHTML=exam();else if(currentPage==='designer')el.innerHTML=designer();else if(currentPage==='glossary')el.innerHTML=glossaryPage();else if(currentPage==='sources')el.innerHTML=sourcesPage();el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go));el.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{currentLesson=Number(b.dataset.lesson);currentPage='lesson';render();window.scrollTo(0,0)});el.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let id=b.dataset.done;if(!state.done.includes(id))state.done.push(id);save();render()});el.querySelectorAll('[data-toggle-solution]').forEach(b=>b.onclick=()=>{let s=document.getElementById('solution'+b.dataset.toggleSolution);s.hidden=!s.hidden;b.textContent=s.hidden?'Ver guía de solución':'Ocultar guía'});el.querySelectorAll('[data-answer]').forEach(a=>a.addEventListener('input',()=>{state.answers[a.dataset.answer]=a.value;save()}));el.querySelectorAll('input[type=radio]').forEach(a=>a.addEventListener('change',()=>{let m=a.name.match(/q(\d+)/);if(m){state.exam[m[1]]=Number(a.value);save()}}));let grade=el.querySelector('#gradeExam');if(grade)grade.onclick=()=>gradeExam();let reset=el.querySelector('#resetExam');if(reset)reset.onclick=()=>{state.exam={};save();render()};}
function gradeExam(){let score=0;questions.forEach((q,i)=>{let chosen=document.querySelector(`input[name="q${i}"]:checked`);let out=document.getElementById('expl'+i);let ok=chosen&&Number(chosen.value)===q[2];if(ok)score++;out.innerHTML=`<span style="color:${ok?'#18834e':'#bd603d'};font-weight:700">${ok?'Correcta.':'Revisa esta respuesta.'}</span> ${q[3]}`});state.best=Math.max(state.best,score);save();let r=document.getElementById('examResult');r.hidden=false;document.getElementById('scoreText').textContent=`Resultado: ${score}/${questions.length}`;document.getElementById('scoreAdvice').textContent=score>=22?'Muy buen dominio. Revisa las preguntas incorrectas.':score>=17?'Buen avance. Repasa los temas con errores y vuelve a intentarlo.':'Vuelve a cardinalidades, ISA y transformación; luego repite el examen.';r.scrollIntoView({behavior:'smooth',block:'center'})}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){nav('glossary')}});document.getElementById('search').addEventListener('input',e=>{if(currentPage==='glossary')render()});render();
</script><script>if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script></body></html>
